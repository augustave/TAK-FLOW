name: Verification

on:
  push:
    branches:
      - main
  pull_request:

# Rapid pushes stack runs; only the newest matters.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The serial browser suite (22 tests) plus build + playwright install
    # needs headroom on 4-core runners; 20 minutes was observed hitting the
    # job timeout ("cancelled") once the suite grew.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Code integrity checks
        run: npm test

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run smoke
